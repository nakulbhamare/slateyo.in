<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Slateyo — Find a Café. Share the Moment. Get Rewarded.</title>
    <meta name="description" content="Slateyo gives every café its own social space. Discover places people love, share authentic moments, scan table QRs, and earn Slate Points for real café rewards." />
    
    <!-- Canonical & SEO Directives -->
    <link rel="canonical" href="https://slateyo.in/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://slateyo.in/" />
    <meta property="og:site_name" content="Slateyo" />
    <meta property="og:title" content="Slateyo — Digital Social Layer for Cafés" />
    <meta property="og:description" content="Find a café. Share the moment. Get rewarded. Discover living café profiles powered by the people who visit." />
    <meta property="og:image" content="https://slateyo.in/assets/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Slateyo — Find a Café. Share the Moment. Get Rewarded." />
    <meta name="twitter:description" content="Slateyo gives every café its own social space. Discover places people love, share authentic moments, scan table QRs, and earn Slate Points for real café rewards." />
    <meta name="twitter:image" content="https://slateyo.in/assets/logo.png" />
    <meta name="theme-color" content="#FAF8F5" />
    
    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://slateyo.in/#website",
          "url": "https://slateyo.in/",
          "name": "Slateyo",
          "description": "Find a café. Share the moment. Get rewarded. Discover living café profiles powered by the people who visit.",
          "inLanguage": "en"
        },
        {
          "@type": "Organization",
          "@id": "https://slateyo.in/#organization",
          "name": "Slateyo",
          "url": "https://slateyo.in/",
          "logo": "https://slateyo.in/assets/logo.png"
        }
      ]
    }
    </script>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    
    <!-- Google Fonts: Plus Jakarta Sans + Newsreader for editorial flair -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-cream-100 text-brand-charcoal font-sans antialiased selection:bg-pink-subtle selection:text-pink-brand min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
